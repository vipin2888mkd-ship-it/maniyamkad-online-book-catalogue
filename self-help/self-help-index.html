<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Help | മാണിയംകാട് ഗ്രാമീണ വായനശാല</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f8f5;color:#12352b;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#064e3b,#087a5a);color:#fff;padding:35px 18px;text-align:center}
header h1{margin:0;font-size:clamp(28px,7vw,48px)}
header p{margin:10px 0 0;opacity:.9}
main{max-width:900px;margin:auto;padding:28px 16px}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
a,.back{display:inline-block;text-decoration:none;padding:11px 17px;border-radius:24px;background:#064e3b;color:#fff;font-weight:bold}
input{width:100%;padding:15px 17px;border:1px solid #d5e3dd;border-radius:15px;font-size:16px;outline:none;margin-bottom:24px}
#books{display:grid;gap:16px}
.card{background:#fff;border:1px solid #dce8e2;border-radius:20px;padding:22px;box-shadow:0 8px 24px #064e3b12}
.card h2{margin:0 0 14px;color:#064e3b;font-size:23px}
.card div{margin:8px 0;color:#42554e}
.card b{color:#064e3b}
.message{text-align:center;padding:30px;background:#fff;border-radius:18px}
</style>
</head>
<body>
<header>
  <h1>Self Help</h1>
  <p>മാണിയംകാട് ഗ്രാമീണ വായനശാല</p>
  <p>നടുവട്ടം – 676561</p>
</header>

<main>
  <div class="top">
    <a href="../">← പ്രധാന പുസ്തകങ്ങൾ</a>
  </div>

  <input id="search" type="search" placeholder="Self Help പുസ്തകം / Author / Code തിരയുക...">

  <div id="books"><div class="message">പുസ്തകങ്ങൾ ലോഡ് ചെയ്യുന്നു...</div></div>
</main>

<script>
const list = document.getElementById("books");
const search = document.getElementById("search");
let books = [];

function render(items){
  if(!items.length){
    list.innerHTML = '<div class="message">പുസ്തകങ്ങൾ ലഭ്യമല്ല.</div>';
    return;
  }

  list.innerHTML = items.map(b => `
    <div class="card">
      <h2>${b.title || ""}</h2>
      <div><b>Code:</b> ${b.code || ""}</div>
      <div><b>Author:</b> ${b.author || ""}</div>
      ${b.isbn ? `<div><b>ISBN:</b> ${b.isbn}</div>` : ""}
    </div>
  `).join("");
}

fetch("books.json")
.then(r => {
  if(!r.ok) throw new Error("Cannot load self-help/books.json");
  return r.json();
})
.then(data => {
  books = Array.isArray(data) ? data : [];
  render(books);
})
.catch(err => {
  console.error(err);
  list.innerHTML = '<div class="message">Self Help പുസ്തകങ്ങൾ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല.</div>';
});

search.addEventListener("input", () => {
  const q = search.value.toLowerCase().trim();
  render(books.filter(b =>
    String(b.title || "").toLowerCase().includes(q) ||
    String(b.author || "").toLowerCase().includes(q) ||
    String(b.code || "").toLowerCase().includes(q) ||
    String(b.isbn || "").toLowerCase().includes(q)
  ));
});
</script>
</body>
</html>
